spring:
    application:
        name: ChatProject
    datasource:
        password: ${DB_PASSWORD}
        url: ${DB_URL}
        username: ${DB_USERNAME}
    flyway:
        enabled: true
        locations: classpath:db/migration
        validate-on-migrate: true
        validate-migration-naming: true
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            ssl:
                enabled: false
    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
        properties:
            mail:
                smtp:
                    auth: ${MAIL_SMTP_AUTH:false}
                    starttls:
                        enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
    servlet:
        multipart:
            max-file-size: 50MB
            max-request-size: 52MB
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope:
                            - openid
                            - profile
                            - email
                            -
jwt:
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION}
    secret: ${JWT_SECRET}

refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION}

cookie:
    secure: ${COOKIE_SECURE}

email-verification:
    hash-secret: ${EMAIL_VERIFICATION_HASH_SECRET}
    code-expiration: ${CODE_EXPIRATION}
    resend-cooldown: ${RESEND_COOLDOWN}
    max-attempts: ${MAX_ATTEMPTS}
    sender: ${MAIL_FROM}

chat:
    storage:
        local-root: ${CHAT_LOCAL_STORAGE_ROOT}
        max-image-size: 10MB
        max-file-size: 50MB